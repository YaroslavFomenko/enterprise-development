name: .NET Tests

on:
  push:
    branches: [ main, lab1, lab2 ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore CarWash.sln
      - name: Build
        run: dotnet build CarWash.sln --no-restore
      - name: Test
        run: dotnet test CarWash.sln --no-build --verbosity normal